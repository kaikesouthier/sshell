<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="0.55" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1030" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App-icon squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#gloss)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>

  <!-- Terminal prompt: a chevron and a cursor underscore -->
  <g fill="none" stroke="#ffffff" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M336 360 L472 512 L336 664"/>
    <path d="M532 664 L688 664"/>
  </g>
</svg>
