<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSHell</title>

    <!-- Nothing loads from the network. The renderer has full Node access, so a
         remote script here could read the decrypted vault and the master passphrase.
         Defence in depth only: CSP does not restrict require(). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">

    <!-- Generated by `npm run css` from tailwind.config.js. -->
    <link rel="stylesheet" href="assets/tailwind.css" />

    <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
    <link rel="stylesheet" href="assets/app.css" />
</head>
<body class="h-screen flex flex-col selection:bg-accent/40 selection:text-white text-sm">

        <div id="mount-topbar" style="display:contents"></div>
    <div class="flex-grow flex min-h-0 border-t border-edge">
        <div id="mount-sidebar" style="display:contents"></div>
        <div id="mount-content" style="display:contents"></div>
    </div>
    <div id="mount-overlays" style="display:contents"></div>

    <script>
        (function () {
            const fs = require('fs');
            const path = require('path');
            document.documentElement.classList.add(process.platform === 'win32' ? 'is-win' : 'is-other');
            const viewsDir = path.join(__dirname, 'views');
            const read = f => fs.readFileSync(path.join(viewsDir, f), 'utf8');
            const fail = (what, e) => {
                document.body.innerHTML =
                    '<div style="padding:40px;color:#f85149;font-family:monospace;white-space:pre-wrap">' +
                    what + '\n\n' + (e && e.stack || e && e.message || e) + '</div>';
            };
            try {
                document.getElementById('mount-topbar').innerHTML = read('topbar.html');
                document.getElementById('mount-sidebar').innerHTML = read('sidebar.html');
                document.getElementById('mount-content').innerHTML = read('content.html');
                document.getElementById('mount-overlays').innerHTML =
                    read('lock.html') + read('popovers.html') + read('dialogs.html') + read('modals.html') + read('inputs.html');
            } catch (e) {
                fail('Failed to load UI partials.', e);
                return;
            }
            try { require('./app.js'); }
            catch (e) { fail('SSHell failed to start.', e); }
        })();
    </script>
</body>
</html>
