<aside id="sidebar" style="width:var(--sidebar-w)" class="shrink-0 bg-panel border-r border-edge flex flex-col min-h-0">
        <div class="h-9 shrink-0 flex items-stretch border-b border-edge text-xs font-semibold">
        <button id="tabSessions" class="side-tab flex-1 flex items-center justify-center gap-1.5 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>Sessions
        </button>
        <button id="tabSftp" class="side-tab flex-1 flex items-center justify-center gap-1.5 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"></path></svg>SFTP
        </button>
    </div>

        <div id="sessionsPane" class="flex flex-col flex-grow min-h-0">
        <div class="h-10 shrink-0 flex items-center justify-between px-3 border-b border-edge">
            <span class="text-[11px] font-semibold tracking-widest text-faint uppercase">Saved</span>
            <div class="flex items-center gap-1">
                <button id="btnBulkAdd" title="Add multiple servers" class="text-muted hover:text-accent transition-colors p-1 rounded hover:bg-panel2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6-3a3 3 0 11-3-3m-9 3a3 3 0 10-3-3"></path></svg>
                </button>
                <button id="btnNewFolder" title="New folder" class="text-muted hover:text-accent transition-colors p-1 rounded hover:bg-panel2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11v4m-2-2h4"></path></svg>
                </button>
                <button id="btnNewSession" title="New session" class="text-muted hover:text-accent transition-colors flex items-center gap-1 text-xs font-medium p-1 rounded hover:bg-panel2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"></path></svg>New
                </button>
            </div>
        </div>
        <div class="p-2 border-b border-edge">
            <div class="relative">
                <svg class="w-3.5 h-3.5 text-faint absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"></path></svg>
                <input id="sessionSearch" type="text" placeholder="Search sessions" class="w-full bg-panel2 border border-edge rounded-md pl-8 pr-2 py-1.5 text-xs text-txt placeholder-faint focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/50 transition-all" />
            </div>
        </div>
        <div id="sessionList" class="flex-grow overflow-y-auto p-1.5 min-h-0"></div>
        <div id="selectionBar" class="hidden shrink-0 border-t border-edge bg-panel2 px-2 py-2 flex items-center gap-1.5">
            <span id="selCount" class="text-[10px] font-semibold text-accent truncate flex-grow"></span>
            <button id="selOpen" class="shrink-0 text-[10px] font-semibold px-2 py-1 rounded bg-accent hover:bg-accent-hover text-white transition-colors whitespace-nowrap">Open</button>
            <button id="selDelete" title="Delete selection" class="shrink-0 w-6 h-6 rounded flex items-center justify-center text-faint hover:text-bad hover:bg-panel3 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.87 12.14A2 2 0 0116.14 21H7.86a2 2 0 01-1.99-1.86L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3m-9 0h14"></path></svg>
            </button>
            <button id="selClear" title="Clear selection (Esc)" class="shrink-0 w-6 h-6 rounded flex items-center justify-center text-faint hover:text-txt hover:bg-panel3 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="shrink-0 border-t border-edge p-2 space-y-1">
            <button id="btnGrid" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-md text-xs font-medium text-muted hover:text-txt hover:bg-panel2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v4H4zM14 15h6v4h-6z"></path></svg>
                Grid Dashboard<span class="ml-auto text-[10px] text-faint">open tabs</span>
            </button>
            <div class="px-2.5 text-[10px] text-faint font-mono flex justify-between">
                <span id="sessCount">0 saved</span><span id="clock">--:--:--</span>
            </div>
        </div>
    </div>

        <div id="sftpPane" class="hidden flex-col flex-grow min-h-0">
        <div class="px-2 pt-2 flex items-center gap-1.5 min-w-0">
            <svg class="w-3 h-3 shrink-0 text-faint" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1zM5 13h14a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1v-5a1 1 0 011-1zM8 7h.01M8 16h.01"></path></svg>
            <span id="sftpTarget" class="hidden text-[11px] font-semibold text-accent truncate"></span>
        </div>
        <div class="p-2 border-b border-edge flex items-center gap-1.5">
            <button id="sftpUp" title="Up one folder" class="shrink-0 w-7 h-7 rounded flex items-center justify-center text-muted hover:text-txt hover:bg-panel2 disabled:opacity-30"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg></button>
            <input id="sftpPath" type="text" placeholder="/home/user" class="flex-grow bg-panel2 border border-edge rounded-md px-2.5 py-1.5 text-xs font-mono text-txt placeholder-faint focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/50" />
        </div>
        <div class="relative shrink-0 border-b border-edge">
        <div class="px-2 py-1.5 flex items-center gap-1">
            <button id="sftpUpload" title="Upload files" class="sftp-tool"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 9l5-5 5 5M12 4v12"></path></svg></button>
            <button id="sftpNewFile" title="New file" class="sftp-tool"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6M4 4a1 1 0 011-1h9l6 6v11a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg></button>
            <button id="sftpNewFolder" title="New folder" class="sftp-tool"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11v4m-2-2h4"></path></svg></button>
            <button id="sftpRefresh" title="Refresh" class="sftp-tool ml-auto"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.6M20 20v-5h-.6M5 9a7 7 0 0111.6-3M19 15a7 7 0 01-11.6 3"></path></svg></button>
        </div>
        <div id="sftpSelBar" class="hidden absolute inset-0 z-10 bg-panel2 px-2 py-1.5 flex items-center gap-1.5">
            <span id="sftpSelCount" class="text-[10px] font-semibold text-accent truncate flex-grow"></span>
            <button id="sftpSelDownload" class="shrink-0 text-[10px] font-semibold px-2 py-1 rounded bg-accent hover:bg-accent-hover text-white transition-colors whitespace-nowrap">Download</button>
            <button id="sftpSelDelete" title="Delete selection" class="shrink-0 w-6 h-6 rounded flex items-center justify-center text-faint hover:text-bad hover:bg-panel3 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.87 12.14A2 2 0 0116.14 21H7.86a2 2 0 01-1.99-1.86L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3m-9 0h14"></path></svg>
            </button>
            <button id="sftpSelClear" title="Clear selection (Esc)" class="shrink-0 w-6 h-6 rounded flex items-center justify-center text-faint hover:text-txt hover:bg-panel3 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        </div>
        <div id="sftpDrop" class="flex-grow overflow-auto min-h-0 relative">
            <div id="sftpBody" class="min-h-full"></div>
            <div id="sftpDropHint" class="hidden absolute inset-0 z-10 bg-accent/10 border-2 border-dashed border-accent m-1 rounded-lg flex items-center justify-center text-accent text-sm font-semibold pointer-events-none">Drop files to upload</div>
        </div>
        <div id="sftpTransfers" class="hidden shrink-0 border-t border-edge max-h-44 overflow-y-auto">
            <div class="px-3 py-1.5 flex items-center justify-between bg-panel2 sticky top-0">
                <span class="text-[10px] font-semibold tracking-widest text-faint uppercase">Transfers</span>
                <span class="flex items-center gap-2">
                    <span id="sftpXferSummary" class="text-[10px] text-muted font-mono"></span>
                    <button id="sftpXferCancelAll" class="hidden text-[10px] text-faint hover:text-bad transition-colors" title="Cancel all active transfers">Cancel all</button>
                </span>
            </div>
            <div id="sftpXferList" class="p-1.5 space-y-1"></div>
        </div>
    </div>
</aside>
