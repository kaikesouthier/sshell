<!-- Must stay BELOW #inputModal (185) and #msgModal (195): the boot-time vault
     recovery prompts are dialogs, and at z-200 this opaque overlay hid them
     completely — the backup could never be restored, and a blind Enter would
     accept an unseen confirm. -->
<div id="lockScreen" class="fixed inset-0 z-[180] bg-bg flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-accent to-indigo-500 flex items-center justify-center shadow-glow mb-5">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h1 id="lockTitle" class="text-xl font-semibold text-txt">Unlock SSHell</h1>
        <p id="lockMsg" class="text-xs text-muted mt-1.5 mb-5">Enter your master passphrase to decrypt your saved sessions.</p>
        <div class="space-y-2.5 text-left">
            <input id="lockPass" type="password" placeholder="Master passphrase" class="w-full bg-panel2 border border-edge rounded-md px-3 py-2.5 text-sm text-txt placeholder-faint focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/50">
            <input id="lockPass2" type="password" placeholder="Confirm passphrase" class="hidden w-full bg-panel2 border border-edge rounded-md px-3 py-2.5 text-sm text-txt placeholder-faint focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/50">
            <div id="lockError" class="hidden text-xs text-bad bg-bad/10 border border-bad/30 rounded-md px-3 py-2"></div>
            <button id="lockBtn" class="w-full bg-accent hover:bg-accent-hover text-white text-sm font-semibold py-2.5 rounded-md transition-colors">Unlock</button>
        </div>
        <p id="lockHint" class="text-[10px] text-faint mt-4 leading-relaxed"></p>
    </div>
</div>
